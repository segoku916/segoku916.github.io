<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>wc link reader</title></head>
<body>
<h3>Paste the WalletConnect link here</h3>
<textarea id="t" rows="6" cols="70" placeholder="click here, then Ctrl+V"></textarea>
<br><button id="b">Show pasted text</button>
<pre id="out">waiting</pre>
<script>
document.getElementById('b').onclick = () => {
  document.getElementById('out').textContent = document.getElementById('t').value;
};
document.getElementById('t').addEventListener('paste', () => {
  setTimeout(() => { document.getElementById('out').textContent = document.getElementById('t').value; }, 50);
});
</script>
</body></html>
